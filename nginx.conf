# FR-043: load-balances the visitor-facing Api across every replica with no single point
# of failure. `max_fails`/`fail_timeout` is nginx open-source's passive health check — a
# replica that fails 2 requests in 10s is pulled out of rotation for that same window and
# retried afterwards, without an external health-checking process. (An active prober against
# GET /health, e.g. nginx-plus or Traefik/HAProxy's health-check directives, is a documented
# upgrade path — not required to satisfy FR-043's "no single point of failure" bar, which is
# about surviving one replica's failure, not about detecting it before the first request hits it.)
events {}

http {
    upstream attribution_api {
        server api1:8080 max_fails=2 fail_timeout=10s;
        server api2:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://attribution_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # One retry against the next healthy upstream on connection failure —
            # SC-005's "zero failed allocation requests" during a mid-flight instance loss
            # depends on this, not just on the passive health check above (which only
            # protects requests *after* a failure has already been observed).
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }
    }
}
