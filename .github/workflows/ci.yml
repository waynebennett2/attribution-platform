name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (build, format, unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check (no unstaged changes)
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Attribution.UnitTests --no-build --configuration Release --logger "trx"

      - name: Integration tests
        run: dotnet test tests/Attribution.IntegrationTests --no-build --configuration Release --logger "trx"

      - name: Contract tests
        run: dotnet test tests/Attribution.Contract --no-build --configuration Release --logger "trx"

  dni-client:
    name: DNI client (lint, format, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/dni-script
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/dni-script/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm test
