<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fallback fixture</title>
  </head>
  <body>
    <!-- No script include at all: simulates the visitor's script being blocked or
         failing to execute (FR-011 edge case). The page must be left showing its
         static default number, since nothing ever runs to change it. -->
    <p id="text-1">Call us on 555-000-0000 today.</p>
  </body>
</html>
