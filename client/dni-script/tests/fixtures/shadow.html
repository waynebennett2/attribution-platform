    <title>Shadow mode fixture</title>

    <!-- Represents a number another system (e.g. Mediahawk) has already inserted. -->

    <script type="module">
      import { reportShadowObservation } from "/src/shadow.js";
      window.__shadowResult = reportShadowObservation({
        apiBaseUrl: "http://localhost:9999",
        websiteId: "33333333-3333-3333-3333-333333333333",
        sessionId: null,
        arrival: { landingPage: window.location.href, referrer: null, utm: {} },
      });
    </script>
