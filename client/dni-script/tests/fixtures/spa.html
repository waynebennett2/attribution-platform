<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SPA fixture</title>
  </head>
  <body>
    <p id="text-1">Call us on 555-123-4567 today.</p>
    <div id="route-outlet"></div>
    <button id="navigate" type="button">Go to page 2</button>

    <script>
      window.__attributionConfig = {
        apiBaseUrl: "http://localhost:9999",
        websiteId: "11111111-1111-1111-1111-111111111111",
        defaultNumber: "555-123-4567",
        configuredNumbers: ["555-123-4567"],
        heartbeatIntervalMs: 300000,
      };

      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("navigate").addEventListener("click", () => {
          // Simulates an in-app (SPA) route change rendering new content with the
          // configured number, without a full page reload.
          const el = document.createElement("p");
          el.id = "text-2";
          el.textContent = "You can also reach us at 555-123-4567.";
          document.getElementById("route-outlet").appendChild(el);
        });
      });
    </script>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
